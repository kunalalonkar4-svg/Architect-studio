services:
  - type: web
    name: drafta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                 # free tier sleeps after ~15 min idle (first open takes ~1 min). Files live in PostgreSQL, so nothing is lost.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL      # paste the Supabase "Session pooler" connection string as-is
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
